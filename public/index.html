<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#080b12;
  color:white;
  height:100vh;
}

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:#101521;
  border-bottom:1px solid #252d3d;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:bold;
}

.logoIcon{
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:linear-gradient(135deg,#00c6ff,#7c3aed);
}

.status{
  font-size:12px;
  color:#4ade80;
}

#chat{
  flex:1;
  overflow-y:auto;
  padding:25px 15px 120px;
}

.welcome{
  text-align:center;
  margin-top:90px;
}

.welcome h1{
  font-size:32px;
  margin-bottom:12px;
}

.welcome p{
  color:#9ca3af;
}

.message{
  max-width:850px;
  margin:18px auto;
  display:flex;
  gap:10px;
  animation:show .25s ease;
}

@keyframes show{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.avatar{
  width:38px;
  height:38px;
  min-width:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#202938;
}

.user .avatar{
  background:#2563eb;
}

.bubble{
  background:#151b28;
  padding:14px 16px;
  border-radius:16px;
  line-height:1.8;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  max-width:calc(100vw - 100px);
}

.user .bubble{
  background:#2563eb;
}

.copy{
  margin-top:7px;
  border:0;
  background:#202938;
  color:#aaa;
  padding:5px 10px;
  border-radius:8px;
  cursor:pointer;
}

.inputArea{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  padding:12px 15px 18px;
  background:linear-gradient(transparent,#080b12 30%);
}

.inputBox{
  max-width:850px;
  margin:auto;
  display:flex;
  align-items:end;
  padding:8px;
  background:#151b28;
  border:1px solid #30394d;
  border-radius:18px;
}

textarea{
  flex:1;
  resize:none;
  background:none;
  border:0;
  outline:none;
  color:white;
  padding:10px;
  font-size:15px;
  max-height:140px;
}

.send{
  width:46px;
  height:46px;
  border:0;
  border-radius:14px;
  background:#2563eb;
  color:white;
  font-size:20px;
  cursor:pointer;
}

.send:disabled{
  opacity:.5;
}

.bottom{
  max-width:850px;
  margin:6px auto 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
}

.bottom button{
  background:none;
  border:0;
  color:#777;
  font-size:12px;
  cursor:pointer;
}

.typing{
  color:#9ca3af;
  font-size:12px;
}

@media(max-width:600px){
  .welcome{
    margin-top:60px;
  }

  .welcome h1{
    font-size:25px;
  }

  .bubble{
    max-width:calc(100vw - 80px);
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">
    <div class="logoIcon">✦</div>
    <span>AI Assistant</span>
  </div>

  <div class="status" id="status">● جاهز</div>
</header>

<main id="chat">

  <div class="welcome" id="welcome">
    <h1>مرحباً 👋</h1>
    <p>أنا مساعدك الذكي، اكتب سؤالك وسأجيبك.</p>
  </div>

</main>

<div class="inputArea">

  <div class="inputBox">

    <textarea
      id="input"
      rows="1"
      placeholder="اكتب رسالتك..."
    ></textarea>

    <button class="send" id="send">➤</button>

  </div>

  <div class="bottom">
    <button id="clear">مسح المحادثة</button>
    <span class="typing" id="typing"></span>
  </div>

</div>

</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");
const typing = document.getElementById("typing");
const statusEl = document.getElementById("status");

let messages = JSON.parse(
  localStorage.getItem("ai_messages") || "[]"
);

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function addMessage(text,type){

  document.getElementById("welcome")?.remove();

  const wrapper = document.createElement("div");

  wrapper.className = "message " + type;

  wrapper.innerHTML = `
    <div class="avatar">
      ${type === "user" ? "👤" : "✦"}
    </div>

    <div>
      <div class="bubble">
        ${escapeHTML(text)}
      </div>

      <button class="copy">
        نسخ
      </button>
    </div>
  `;

  wrapper
    .querySelector(".copy")
    .addEventListener("click",async()=>{

      await navigator.clipboard.writeText(text);

      wrapper.querySelector(".copy").textContent =
        "تم النسخ ✓";

      setTimeout(()=>{
        wrapper.querySelector(".copy").textContent =
          "نسخ";
      },1200);

    });

  chat.appendChild(wrapper);

  chat.scrollTop = chat.scrollHeight;

}

function save(){

  localStorage.setItem(
    "ai_messages",
    JSON.stringify(messages)
  );

}

async function sendMessage(){

  const text = input.value.trim();

  if(!text || send.disabled) return;

  addMessage(text,"user");

  messages.push({
    role:"user",
    content:text
  });

  save();

  input.value = "";
  input.style.height = "auto";

  send.disabled = true;

  typing.textContent = "يفكر...";
  statusEl.textContent = "● يفكر";

  try{

    const response = await fetch("/api/chat",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        messages:messages
      })

    });

    const data = await response.json();

    if(!response.ok){

      throw new Error(
        data.error || "حدث خطأ"
      );

    }

    addMessage(
      data.answer,
      "assistant"
    );

    messages.push({
      role:"assistant",
      content:data.answer
    });

    save();

    statusEl.textContent = "● جاهز";

  }catch(error){

    addMessage(
      "تعذر الاتصال بالخادم. تأكد من إعداد API ثم حاول مرة أخرى.",
      "assistant"
    );

    statusEl.textContent = "● خطأ";

  }finally{

    send.disabled = false;

    typing.textContent = "";

    input.focus();

  }

}

send.addEventListener(
  "click",
  sendMessage
);

input.addEventListener(
  "keydown",
  e=>{

    if(e.key === "Enter" && !e.shiftKey){

      e.preventDefault();

      sendMessage();

    }

  }
);

input.addEventListener(
  "input",
  ()=>{

    input.style.height = "auto";

    input.style.height =
      Math.min(input.scrollHeight,140) + "px";

  }
);

document.getElementById("clear")
.addEventListener(
  "click",
  ()=>{

    if(!confirm("هل تريد حذف المحادثة؟"))
      return;

    messages = [];

    save();

    location.reload();

  }
);

messages.forEach(
  m=>{

    addMessage(
      m.content,
      m.role === "user"
        ? "user"
        : "assistant"
    );

  }
);

</script>

</body>
</html>
